# CoreProtect language file
# ---------------------------------------------------------------------------
# Every message the plugin sends is defined here. Edit freely -- run
# "/co reload" to apply changes without restarting.
#
# COLOUR CODES
#   Write them with & (for example &3). Both & and the section sign work.
#
# STYLE TOKENS
#   Any {NAME} below from colors: or symbols: can be used inside any message.
#   Change PRIMARY and SECONDARY once and every message re-themes with it,
#   because the messages reference the tokens rather than hard-coding colours.
#
#     {PRIMARY}   {SECONDARY}   {TERTIARY}   {ERROR}
#     {ITALIC}    {STRIKE}      {RESET}
#     {PREFIX}    {PLUGIN_NAME} {SEPARATOR}
#
#   Symbols may themselves contain tokens -- PREFIX is built from PRIMARY,
#   PLUGIN_NAME, SECONDARY and SEPARATOR, so re-theming needs no message edits.
#
# PLACEHOLDERS
#   {0}, {1}, ... are filled in by the plugin (counts, names, times, ...).
#   Keep them, or drop one if you do not want that value shown. They are
#   inserted verbatim and are never re-scanned for tokens.
#
# A key you delete falls back to the copy bundled inside the jar, so nothing
# breaks if you remove one or upgrade to a version that adds more.
# ---------------------------------------------------------------------------

colors:
  PRIMARY: "&3"
  SECONDARY: "&f"
  TERTIARY: "&7"
  ERROR: "&c"
  ITALIC: "&o"
  STRIKE: "&m"
  RESET: "&r"

symbols:
  PLUGIN_NAME: "CoreProtect"
  SEPARATOR: "-"
  # The header in front of almost every message. Built from the tokens above,
  # so recolouring the plugin is a two-line edit.
  PREFIX: "{PRIMARY}{PLUGIN_NAME} {SECONDARY}{SEPARATOR} "

