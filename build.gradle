plugins {
    id 'java'
}

group = 'net.coreprotect'
version = '2.15.2'
description = 'Provides block protection for your server.'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
    maven {
        name = 'enginehub-repo'
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    // Bukkit/Spigot API. 1.12.2 is the last version with the legacy Material/data
    // value API that this plugin is written against.
    // Resolved without transitives: its bungeecord-chat dependency drags in a
    // parent POM that is no longer published anywhere.
    compileOnly('org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT') {
        transitive = false
    }

    // Libraries Spigot ships in the server jar, declared explicitly since the
    // spigot-api transitives are switched off above.
    compileOnly 'com.google.code.gson:gson:2.8.0'
    compileOnly 'com.googlecode.json-simple:json-simple:1.1.1'
    compileOnly 'commons-lang:commons-lang:2.6'
    compileOnly 'com.google.guava:guava:21.0'
    compileOnly 'org.yaml:snakeyaml:1.18'

    // WorldEdit 6.x -- the last line that exposes com.sk89q.worldedit.Vector and
    // com.sk89q.worldedit.blocks.BaseBlock, which net.coreprotect.worldedit uses.
    // worldedit-bukkit only carries the Bukkit glue (WorldEditPlugin, BukkitWorld);
    // Vector/Actor/Extent & co. live in worldedit-core, whose last 6.x release is 6.1.
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:6.1.5') {
        transitive = false
    }
    compileOnly('com.sk89q.worldedit:worldedit-core:6.1') {
        transitive = false
    }

    // Tests drive the real consumer queue and a real SQLite database, so they
    // need the Bukkit interfaces on the classpath and a JDBC driver the server
    // would normally supply from its own jar.
    testImplementation('org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT') {
        transitive = false
    }
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // ./gradlew test -Pcompat.db=/path/to/a/copy runs the upgrade-compatibility
    // test against a real database. Skipped when absent.
    if (findProperty('compat.db')) {
        systemProperty 'compat.db', findProperty('compat.db')
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// ./gradlew benchmark -- SQLite settings compared head to head. Not part of
// `check`; it takes about a minute and reports timings rather than pass/fail.
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measures CoreProtect database operations under the old and new SQLite settings.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.coreprotect.bench.DatabaseBenchmark'
    // JavaExec forks, so -Dbench.* on the gradle command line has to be passed
    // through explicitly or the benchmark silently uses its defaults.
    systemProperty 'bench.rows', findProperty('bench.rows') ?: System.getProperty('bench.rows') ?: '300000'
    systemProperty 'bench.seconds', findProperty('bench.seconds') ?: System.getProperty('bench.seconds') ?: '6'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// ./gradlew dbreport -Pdb=/path/to/database.db -- where a real database's bytes
// have gone, per table and per index. Reads every page, so use a copy.
tasks.register('dbreport', JavaExec) {
    group = 'verification'
    description = 'Reports per-table and per-index storage usage of a CoreProtect SQLite database.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.coreprotect.bench.StorageReport'
    systemProperty 'db.path', findProperty('db') ?: ''
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Spigot 1.12.2 targets Java 8; --release keeps us honest against its API.
    options.release = 8
    // The sources are decompiled output; silence the noise that comes with it.
    options.compilerArgs += ['-Xlint:none', '-nowarn']
}

processResources {
    def pluginVersion = project.version.toString()
    inputs.property 'version', pluginVersion
    filesMatching('plugin.yml') {
        expand version: pluginVersion
    }
}

jar {
    archiveBaseName = 'CoreProtect-Legacy'
    archiveVersion = project.version

    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Built-By': 'Intelli'
        )
    }
}

tasks.register('printTestCp') {
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}
