name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is committed, so verify it against Gradle's published
      # checksums before executing it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Any JDK 8+ works: the build pins --release 8, so the bytecode
          # targets Java 8 regardless of the JDK compiling it.
          java-version: '21'
          cache: gradle

      # git does not preserve the exec bit when the repo is pushed from Windows.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect-Legacy
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
